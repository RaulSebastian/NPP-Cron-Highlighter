name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, x64)
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/NppCronHighlighter.dll dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/NppCronHighlighter.dll, dist/README.md `
            -DestinationPath dist/NppCronHighlighter.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NppCronHighlighter
          path: dist/
          if-no-files-found: error

  # Only runs after a push lands on main (i.e. after a PR merges), not on
  # the PR build itself — the "build" job above already gives PRs a
  # pass/fail signal without cutting a release.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: NppCronHighlighter
          path: dist

      - name: Update rolling "latest" release
        run: |
          set -e
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest \
            dist/NppCronHighlighter.dll \
            dist/NppCronHighlighter.zip \
            --target "${GITHUB_SHA}" \
            --title "Latest build (${SHORT_SHA})" \
            --notes "Automated build from commit ${GITHUB_SHA}."
